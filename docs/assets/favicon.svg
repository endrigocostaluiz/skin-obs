<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="fav-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <radialGradient id="fav-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#07090E" />
    </radialGradient>
  </defs>

  <!-- Fundo escuro arredondado moderno -->
  <rect width="32" height="32" rx="7" fill="url(#fav-bg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Hélices Lumina OBS de Alto Contraste -->
  <g transform="translate(16, 16)">
    <!-- Hélice 1 -->
    <path d="M0,-11 C3,-11 11,-7 10,-1 C9,1 5,2 2,0 C0,-2 1,-8 0,-11 Z" fill="#3B82F6" />
    <!-- Hélice 2 -->
    <path d="M10,4 C10,7 4,12 -1,10 C-3,9 -3,5 -1,3 C2,1 7,3 10,4 Z" fill="#10B981" />
    <!-- Hélice 3 -->
    <path d="M-8,3 C-10,0 -8,-7 -2,-8 C0,-8 1,-5 0,-3 C-2,0 -5,1 -8,3 Z" fill="#8B5CF6" />

    <!-- Núcleo central neon -->
    <circle cx="0" cy="0" r="3.2" fill="#07090E" stroke="url(#fav-g)" stroke-width="1.8" />
    <circle cx="0" cy="0" r="1.4" fill="#38BDF8" />
  </g>
</svg>
